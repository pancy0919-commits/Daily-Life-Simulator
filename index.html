<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>十年：從8歲到18歲的日常迴圈</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-container {
            width: 100%;
            max-width: 480px;
            height: 520px;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            border: 4px solid #38bdf8;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
        }
        .status-box {
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
        }
        .age-display {
            font-size: 20px;
            font-weight: bold;
            color: #f43f5e;
            margin-bottom: 3px;
        }
        .day-display {
            font-size: 13px;
            color: #94a3b8;
        }
        
        /* 圖片展示框 */
        .image-frame {
            width: 100%;
            height: 180px;
            background: #090d16;
            border: 2px solid #38bdf8;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .image-emoji {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .image-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
        }

        .routine-box {
            width: 100%;
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
            text-align: center;
            border: 1px dashed #64748b;
        }
        .routine-text {
            font-size: 14px;
            color: #e2e8f0;
            line-height: 1.5;
            min-height: 40px;
        }
        .action-btn {
            background-color: #38bdf8;
            color: #0f172a;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56,189,248,0.3);
            -webkit-tap-highlight-color: transparent;
        }
        .action-btn:active { background-color: #0ea5e9; transform: scale(0.98); }

        .screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #f43f5e;
            color: #fff;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(244,63,94,0.4);
        }
        .btn:active { background-color: #e11d48; transform: scale(0.96); }

        .debug-btn {
            position: absolute;
            bottom: 6px;
            right: 10px;
            background: #334155;
            color: #94a3b8;
            border: 1px solid #64748b;
            padding: 3px 6px;
            font-size: 10px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 30;
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameContainer">
        <!-- 開始畫面 -->
        <div id="startScreen" class="screen-overlay">
            <h2 style="color: #38bdf8; margin-bottom: 10px; font-size: 20px;">🕰️ 十年：從8歲到18歲</h2>
            <p style="font-size: 13px; color: #cbd5e0; max-width: 320px; line-height: 1.6; margin: 0 0 15px 0;">
                每天過著規律而平凡的生活。<br>
                每句話都配有專屬的日常圖像與語錄。<br>
                <b>當你度過 3,650 天（10年），抵達 18 歲那年，將迎來改變一切的瞬間。</b>
            </p>
            <button class="btn" id="startBtn">開始人生迴圈</button>
        </div>

        <!-- 18歲成年特殊結局畫面 -->
        <div id="endingScreen" class="screen-overlay" style="display: none; background: rgba(15, 23, 42, 0.98);">
            <div style="font-size: 36px; margin-bottom: 2px;">🎓✨</div>
            <h2 style="color: #ffd700; margin: 4px 0; font-size: 18px;">第 3650 天：迎向 18 歲的成年禮</h2>
            <div id="endingContent" style="font-size: 12px; color: #e2e8f0; max-width: 420px; max-height: 200px; overflow-y: auto; text-align: left; background: #1e293b; padding: 12px; border-radius: 8px; border: 2px solid #ffd700; line-height: 1.6; margin-top: 8px;">
            </div>
            <button class="btn" style="background-color: #2ed573;" id="restartBtn">重新體驗人生</button>
        </div>

        <!-- 遊戲主介面 -->
        <div class="status-box">
            <div class="age-display" id="ageDisplay">年齡：8 歲 0 個月</div>
            <div class="day-display" id="dayDisplay">已度過天數：第 1 天 / 3650 天</div>
        </div>

        <!-- 專屬圖片展示區 -->
        <div class="image-frame" id="imageFrame">
            <div class="image-emoji" id="imgEmoji">🪟☁️</div>
            <div class="image-title" id="imgTitle">我想要長大</div>
        </div>

        <div class="routine-box">
            <div class="routine-text" id="routineText">早自習發呆，看著窗外的藍天白雲。</div>
        </div>

        <button class="action-btn" id="nextDayBtn">度過今天 (+1 天)</button>

        <button class="debug-btn" id="debugBtn">⚡ 快轉 +364天</button>
    </div>

    <script>
        const endingParagraphs = [
            "當鬧鐘在早晨七點響起時，你下意識地想像往常一樣伸出手的按掉它，然後準備迎接又一個平凡的學校日。但鏡子裡的倒影停住了——你已經不再是那個8歲、背著過大書包的小孩了。",
            "今天是你的 18 歲生日，也是這整整十年、三千六百五十個日子以來，唯一的轉捩點。桌上散落著過去十年累積的考卷、日記和泛黃的便條紙，每一天看起來都一模一樣，卻又在無形中將你雕刻成了一個大人。",
            "回頭看去，那段漫長而規律的迴圈就像是一場長長的夢。你曾以為日子會永遠這樣平淡地重複下去，但時間從未停歇。今天，童年的圍牆正式倒塌，外面的世界鋪展在眼前。",
            "你推開房門，陽光灑在臉上。背包裡裝著對未來的迷茫與憧憬，你終於走出了這個長達十年的日常迴圈。屬於你真正的冒險，現在才要開始。"
        ];

        // 每句話都對應一張專屬圖片（Emoji與標題）與文字
        const dailyEvents = [
            {
                emoji: "🪟☁️",
                title: "我想要長大",
                text: "早自習發呆，看著窗外的藍天白雲。"
            },
            {
                emoji: "✉️👩‍🏫",
                title: "上課偷偷傳紙條",
                text: "躲過老師的視線，和同學分享秘密。"
            },
            {
                emoji: "⚽🌅",
                title: "放學後踢足球",
                text: "夕陽下拉長的影子，汗水和笑聲。"
            },
            {
                emoji: "📝🏫",
                title: "期中考的煎熬",
                text: "筆尖在紙上沙沙作響，祈禱著好成績。"
            },
            {
                emoji: "🍉📺",
                title: "漫長的暑假午後",
                text: "吹著冷氣吃西瓜，電視播著重播的卡通。"
            },
            {
                emoji: "🚲🌳",
                title: "巷口的小冒險",
                text: "騎著腳踏車探索社區每一個角落。"
            },
            {
                emoji: "🌧️🌂",
                title: "雨天的放學路",
                text: "踩著水漥，雨滴打在雨傘上的規律節奏。"
            },
            {
                emoji: "🌙📖",
                title: "深夜的檯燈下",
                text: "寫不完的作業，伴隨著微弱的蟲鳴聲。"
            }
        ];

        let totalDays = 1;
        let ageYears = 8;
        let ageMonths = 0;

        const startScreen = document.getElementById("startScreen");
        const endingScreen = document.getElementById("endingScreen");
        const ageDisplay = document.getElementById("ageDisplay");
        const dayDisplay = document.getElementById("dayDisplay");
        const routineText = document.getElementById("routineText");
        const imgEmoji = document.getElementById("imgEmoji");
        const imgTitle = document.getElementById("imgTitle");
        const nextDayBtn = document.getElementById("nextDayBtn");
        const debugBtn = document.getElementById("debugBtn");

        document.getElementById("startBtn").addEventListener("click", () => {
            startScreen.style.display = "none";
            updateDisplay();
        });

        document.getElementById("restartBtn").addEventListener("click", () => {
            totalDays = 1;
            ageYears = 8;
            ageMonths = 0;
            endingScreen.style.display = "none";
            updateDisplay();
        });

        nextDayBtn.addEventListener("click", () => {
            advanceDays(1);
        });

        debugBtn.addEventListener("click", () => {
            advanceDays(364); // 快轉接近一年
        });

        function advanceDays(days) {
            totalDays += days;
            if (totalDays > 3650) {
                totalDays = 3650;
            }

            let elapsedYears = Math.floor((totalDays - 1) / 365);
            ageYears = 8 + elapsedYears;
            if (ageYears > 18) ageYears = 18;

            let remainingDaysInYear = (totalDays - 1) % 365;
            ageMonths = Math.floor(remainingDaysInYear / 30);

            updateDisplay();

            if (totalDays >= 3650) {
                triggerEnding();
            }
        }

        function updateDisplay() {
            ageDisplay.innerText = `年齡：${ageYears} 歲 ${ageMonths} 個月`;
            dayDisplay.innerText = `已度過天數：第 ${totalDays} 天 / 3650 天`;

            // 隨機抽選一組圖文事件
            let event = dailyEvents[Math.floor(Math.random() * dailyEvents.length)];
            imgEmoji.innerText = event.emoji;
            imgTitle.innerText = event.title;
            routineText.innerText = `[第 ${totalDays} 天] ${event.text}`;
        }

        function triggerEnding() {
            const contentBox = document.getElementById("endingContent");
            contentBox.innerHTML = endingParagraphs.map(p => `<p style="margin-bottom: 8px;">${p}</p>`).join("");
            endingScreen.style.display = "flex";
        }
    </script>
</body>
</html>
